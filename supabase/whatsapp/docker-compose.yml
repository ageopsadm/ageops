# Número único da Age Ops via Evolution (teste). Não use o chip do cliente final.
# Documentação: README.md neste diretório.

services:
  evolution:
    image: evoapicloud/evolution-api:v2.2.3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave}
      DATABASE_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${WHATSAPP_WEBHOOK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_store:/evolution/store

volumes:
  evolution_store:
